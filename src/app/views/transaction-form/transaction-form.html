<div class="min-h-[80vh] flex items-center justify-center p-6 bg-gray-50">
  <div class="w-full max-w-lg">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">

      <!-- Header -->
      <div class="bg-gradient-to-r p-6 text-white"
           [class.from-green-500]="isDeposit"
           [class.to-green-600]="isDeposit"
           [class.from-red-500]="!isDeposit"
           [class.to-red-600]="!isDeposit">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
            <mat-icon>{{ isDeposit ? 'add' : 'remove' }}</mat-icon>
          </div>
          <div>
            <h1 class="text-xl font-bold">{{ isDeposit ? 'Deposito' : 'Prelievo' }}</h1>
            <p class="text-sm opacity-80">Account #{{ accountId }}</p>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div class="p-6 space-y-4">
        <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
          <mat-label>Importo</mat-label>
          <span matTextPrefix>{{ currencySymbol }}&nbsp;</span>
          <input matInput type="number" [(ngModel)]="amount" min="0.01" step="0.01" placeholder="0.00" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
          <mat-label>Descrizione (opzionale)</mat-label>
          <input matInput [(ngModel)]="description"
                 [placeholder]="isDeposit ? 'Stipendio, bonifico...' : 'Prelievo bancomat, spesa...'" />
        </mat-form-field>

        @if (error()) {
          <div class="flex items-center gap-2 text-red-600 bg-red-50 p-3 rounded-lg text-sm">
            <mat-icon style="font-size: 16px; width: 16px; height: 16px;">error</mat-icon>
            {{ error() }}
          </div>
        }

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button mat-button (click)="cancel()" class="w-full sm:flex-1">Annulla</button>
          <button mat-raised-button (click)="submit()"
                  [disabled]="operationMutation.isPending() || !amount || amount <= 0"
                  class="w-full sm:flex-1 !text-white"
                  [class.!bg-green-600]="isDeposit"
                  [class.!bg-red-600]="!isDeposit">
            @if (operationMutation.isPending()) {
              <div class="flex items-center justify-center gap-2">
                <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                Elaborazione...
              </div>
            } @else {
              <div class="flex items-center justify-center gap-1">
                <mat-icon style="font-size: 16px; width: 16px; height: 16px;">check_circle</mat-icon>
                {{ isDeposit ? 'Deposita' : 'Preleva' }}
              </div>
            }
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
