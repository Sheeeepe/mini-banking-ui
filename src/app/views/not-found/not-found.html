<div class="min-h-[80vh] flex items-center justify-center bg-gray-50 p-6">
  <div class="text-center max-w-md">

    <!-- 404 number -->
    <div class="relative mb-8 select-none">
      <span class="text-[10rem] font-black text-indigo-100 leading-none tracking-tighter">404</span>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center shadow-lg">
          <mat-icon class="text-white" style="font-size: 40px; width: 40px; height: 40px;">search_off</mat-icon>
        </div>
      </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button mat-raised-button color="primary" routerLink="/home" class="!px-6">
        <mat-icon class="mr-1" style="font-size: 18px; width: 18px; height: 18px;">home</mat-icon>

      </button>
      <button mat-button routerLink="/accounts" class="!px-6 text-gray-600">
        <mat-icon class="mr-1" style="font-size: 18px; width: 18px; height: 18px;">account_balance</mat-icon>

      </button>
    </div>

  </div>
</div>
