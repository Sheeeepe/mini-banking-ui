<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center shadow-lg">
        <mat-icon class="text-white" style="font-size: 28px; width: 28px; height: 28px;">account_balance</mat-icon>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Accedi a BankingApp</h1>
      <p class="text-gray-500 text-sm mt-1">Bentornato! Inserisci le tue credenziali.</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-5">

      <!-- Google button -->
      <button type="button" (click)="loginWithGoogle()" [disabled]="loading()"
              class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-lg py-2.5 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 active:bg-gray-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0">
          <path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/>
          <path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/>
          <path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 000 10.76l3.98-3.09z"/>
          <path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0c-4.69 0-8.74 2.7-10.71 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        Continua con Google
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">oppure</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Form -->
      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix class="mr-2 text-gray-400">email</mat-icon>
        <input matInput type="email" [(ngModel)]="email" (keyup.enter)="submit()" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix class="mr-2 text-gray-400">lock</mat-icon>
        <input matInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password"
               (keyup.enter)="submit()" autocomplete="current-password" />
        <button matSuffix mat-icon-button type="button" (click)="showPassword = !showPassword" tabindex="-1">
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <div class="flex items-center gap-2 text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2 text-sm">
          <mat-icon style="font-size: 16px; width: 16px; height: 16px;">error_outline</mat-icon>
          {{ error() }}
        </div>
      }

      <button mat-raised-button color="primary" (click)="submit()"
              [disabled]="loading() || !email || !password"
              class="w-full !py-1.5">
        @if (loading()) {
          <div class="flex items-center justify-center gap-2">
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            Accesso in corso...
          </div>
        } @else {
          Accedi
        }
      </button>

    </div>

    <!-- Register link -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Non hai un account?
      <a routerLink="/register" class="text-indigo-600 font-semibold hover:underline">Registrati</a>
    </p>

  </div>
</div>
