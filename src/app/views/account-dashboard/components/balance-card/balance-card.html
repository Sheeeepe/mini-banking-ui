<div class="bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-2xl shadow-lg p-6 md:p-8 text-white">
  <div class="flex items-center justify-between mb-2">
    <div>
      <p class="text-indigo-200 text-sm font-medium">{{ ownerName }}</p>
      <p class="text-indigo-300 text-xs">Account #{{ accountId }}</p>
    </div>
    <div class="bg-white/10 rounded-lg px-3 py-1">
      <span class="text-sm font-medium">{{ currency }}</span>
    </div>
  </div>
  <p class="text-4xl md:text-5xl font-bold mt-4 tracking-tight">
    {{ balance | currency: currency : 'symbol' : '1.2-2' }}
  </p>
  <div class="flex flex-col sm:flex-row gap-3 mt-6">
    <button mat-raised-button
            class="!bg-white !text-indigo-700 !font-semibold flex items-center gap-1 !rounded-lg"
            [routerLink]="['/accounts', accountId, 'deposit']">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">add</mat-icon>
      Deposita
    </button>
    <button mat-raised-button
            class="!bg-white/20 !text-white !font-semibold flex items-center gap-1 !rounded-lg"
            [routerLink]="['/accounts', accountId, 'withdraw']">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">remove</mat-icon>
      Preleva
    </button>
    <button mat-raised-button
            class="!bg-white/20 !text-white !font-semibold flex items-center gap-1 !rounded-lg"
            [routerLink]="['/accounts', accountId, 'transfer']">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">swap_horiz</mat-icon>
      Trasferisci
    </button>
  </div>
</div>
