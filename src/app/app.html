<app-navbar (menuToggle)="sidenav.toggle()"></app-navbar>
<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()" class="app-sidenav">
    <div class="sidenav-header">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Navigazione</p>
    </div>
    <mat-nav-list class="pt-0">
      <a mat-list-item routerLink="/home" routerLinkActive="active-link" (click)="onNavClick(sidenav)">
        <mat-icon matListItemIcon class="text-gray-500">home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <a mat-list-item [routerLink]="selectedAccount() ? ['/accounts', selectedAccount()!.id] : ['/accounts']"
        routerLinkActive="active-link" (click)="onNavClick(sidenav)">
        <mat-icon matListItemIcon class="text-gray-500">account_balance</mat-icon>
        <span matListItemTitle>Conti</span>
      </a>
      @if (selectedAccount(); as acc) {
      <a mat-list-item [routerLink]="['/accounts', acc.id, 'transactions']" routerLinkActive="active-link"
        (click)="onNavClick(sidenav)">
        <mat-icon matListItemIcon class="text-gray-500">receipt_long</mat-icon>
        <span matListItemTitle>Movimenti</span>
      </a>
      }
    </mat-nav-list>
    @if (selectedAccount(); as acc) {
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-200 bg-white">
      <p class="text-xs text-gray-400">Account attivo</p>
      <p class="text-sm font-medium text-gray-700 truncate">{{ acc.owner_name }}</p>
      <p class="text-xs text-gray-500">#{{ acc.id }} &middot; {{ acc.currency }}</p>
    </div>
    }
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
