<nav class="bg-white border-b border-gray-200 shadow-sm">
  <div class="px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button mat-icon-button (click)="menuToggle.emit()" class="text-gray-500">
        <mat-icon>menu</mat-icon>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-indigo-700 flex items-center justify-center">
          <mat-icon class="text-white text-sm" style="font-size: 18px; width: 18px; height: 18px;">account_balance</mat-icon>
        </div>
        <span class="text-lg font-bold text-gray-800">BankingApp</span>
      </div>
    </div>

    <div class="flex items-center gap-4">
      @if (selectedAccount(); as acc) {
        <div class="hidden sm:flex items-center gap-2 text-sm text-gray-500">
          <mat-icon class="text-gray-400 text-sm" style="font-size: 16px; width: 16px; height: 16px;">account_circle</mat-icon>
          <span>{{ acc.owner_name }}</span>
          <span class="text-gray-300">|</span>
          <span class="font-medium text-gray-700">{{ acc.currency }} {{ acc.balance }}</span>
        </div>
      }
      @if (selectedAccount()) {
        <button mat-icon-button class="text-gray-400" (click)="logout()" matTooltip="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      }
      <button mat-icon-button class="text-gray-400">
        <mat-icon>notifications_none</mat-icon>
      </button>
    </div>
  </div>
</nav>
